# Serves the SPA and proxies the API. TLS is terminated in front of this container.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 12m;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location /api/v1/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        # the access token is in the query string; keep it out of the logs
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Any add_header here stops the server-level CSP from being added on top
        # of the backend's own, which allows the Swagger UI assets.
        add_header Cache-Control "no-cache";
    }

    # metrics are scraped inside the Docker network only
    location = /metrics {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
