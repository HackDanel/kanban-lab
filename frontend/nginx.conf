# Serves the SPA and proxies the API. TLS is terminated in front of this container.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Reused connections to the backend: without keepalive every proxied request
# opens a new TCP connection and under load the ephemeral ports run out.
upstream backend {
    server backend:8080;
    keepalive 128;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Requests arrive through the edge nginx (or the Docker bridge locally);
    # trust its X-Real-IP so the backend rate-limits per client, not per proxy.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    client_max_body_size 12m;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location /api/v1/ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        # the access token is in the query string; keep it out of the logs
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # Any add_header here stops the server-level CSP from being added on top
        # of the backend's own, which allows the Swagger UI assets.
        add_header Cache-Control "no-cache";
    }

    # metrics are scraped inside the Docker network only
    location = /metrics {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
