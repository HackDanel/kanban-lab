name: CI/CD

# lint → unit tests → build → integration tests → e2e tests → security scan → deploy to staging → deploy to production
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io/hackdanel/kanban-lab

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: OpenAPI contract
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
      - name: Generated Go code is up to date
        working-directory: backend
        run: go generate ./... && git diff --exit-code
      - name: Frontend lint, format, types
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run gen:api && git diff --exit-code src/shared/api/schema.d.ts
          npm run typecheck

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend unit tests
        working-directory: backend
        run: go test -race ./internal/...
      - name: Frontend unit tests with coverage (80% lines, 70% branches)
        working-directory: frontend
        run: npm ci && npm run test:coverage
      - uses: codecov/codecov-action@v7
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  build:
    name: Build images
    needs: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Unit and integration tests with coverage (PostgreSQL and Redis in testcontainers)
        working-directory: backend
        run: |
          go test -race -coverpkg=./internal/... -coverprofile=coverage.raw ./...
          grep -v -E '/internal/http/api/api.gen.go|/internal/repository/.*\.sql\.go|/internal/repository/(db|models|querier)\.go' coverage.raw > coverage.out
          sh scripts/check-coverage.sh
      - name: Branch coverage (70%)
        working-directory: backend
        run: sh scripts/branch-coverage.sh | tee branch-coverage.txt
      - uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/branch-coverage.txt

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, edge]
    env:
      AUTH_RATE_LIMIT: "10000"
      BCRYPT_COST: "10"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser == 'edge' && 'msedge' || matrix.browser }}
      - name: Playwright
        working-directory: e2e
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
        run: npx playwright test
      - name: Server logs
        if: failure()
        run: docker compose logs backend web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  api:
    name: API tests (Newman)
    needs: build
    runs-on: ubuntu-latest
    env:
      AUTH_RATE_LIMIT: "10000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: docker compose up -d --build --wait
      - name: Newman
        run: |
          mkdir -p tests/postman/reports
          npx --yes -p newman@6 -p newman-reporter-htmlextra newman run tests/postman/kanban.postman_collection.json \
            -e tests/postman/local.postman_environment.json \
            -r cli,junit,htmlextra \
            --reporter-junit-export tests/postman/reports/newman.xml \
            --reporter-htmlextra-export tests/postman/reports/newman.html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: newman
          path: tests/postman/reports

  security:
    name: Security scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: govulncheck, gosec, npm audit
        run: |
          (cd frontend && npm ci) && (cd e2e && npm ci)
          sh tests/security/deps.sh
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Trivy image scan (fails on fixable High and Critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: kanban-backend:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: kanban-web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: OWASP ZAP baseline and API scan
        run: sh tests/security/zap-baseline.sh http://localhost:8000
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-reports
          path: tests/security/reports

  deploy-staging:
    name: Deploy to staging
    needs: [integration, e2e, api, security]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Deploy
        # The key is restricted on the server to deploy/ci-command.sh: with the
        # job token from stdin it fetches this commit's deployment files and runs
        # deploy.sh, nothing else.
        run: |
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" deploy staging "${{ github.sha }}"
      - name: Smoke test
        run: |
          curl -fsS "${{ vars.STAGING_URL }}/readyz"
          curl -fsS -o /dev/null "${{ vars.STAGING_URL }}/"
          npx --yes newman@6 run tests/postman/kanban.postman_collection.json \
            --env-var baseUrl="${{ vars.STAGING_URL }}" \
            --env-var adminEmail="${{ secrets.STAGING_ADMIN_EMAIL }}" \
            --env-var adminPassword="${{ secrets.STAGING_ADMIN_PASSWORD }}"

  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Deploy
        run: |
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" deploy production "${{ github.sha }}"
      - name: Smoke test
        run: |
          curl -fsS "${{ vars.PRODUCTION_URL }}/readyz"
          curl -fsS -o /dev/null "${{ vars.PRODUCTION_URL }}/"
