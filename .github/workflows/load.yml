name: Load test

# Нагрузочное тестирование staging вручную. Расписания нет: staging работает на
# общем домашнем сервере, и 1000 пользователей по таймеру мешали бы другим сервисам.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: crud (1000 пользователей) или rps (постоянный поток)
        type: choice
        options: [crud, rps]
        default: crud
      vus:
        description: Виртуальных пользователей (crud)
        default: "200"
      rate:
        description: Запросов в секунду (rps)
        default: "200"

permissions:
  contents: read

jobs:
  k6:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: k6
        run: |
          mkdir -p tests/load/results && chmod 777 tests/load/results
          docker run --rm -v "$PWD/tests/load:/scripts" \
            -e BASE_URL="${{ vars.STAGING_URL }}" \
            -e ADMIN_EMAIL="${{ secrets.STAGING_ADMIN_EMAIL }}" \
            -e ADMIN_PASSWORD="${{ secrets.STAGING_ADMIN_PASSWORD }}" \
            -e VUS="${{ inputs.vus }}" -e RATE="${{ inputs.rate }}" -e CARDS=2000 \
            grafana/k6 run "/scripts/${{ inputs.scenario || 'crud' }}.js"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-results
          path: tests/load/results
